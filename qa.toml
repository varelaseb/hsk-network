# QA capture target: HSK network static site and its bubbles game (jev-capture.spec.html#jc-target),
# for docs/specs/hsk-network.spec.html, docs/specs/hsk-bubbles.spec.html, and docs/specs/hsk-app.spec.html.
# Story and criterion keys are unique across the specs, so each entry below belongs to exactly one of them.
# Python stdlib only: no setup, rebuild, or env file. The site is served unchanged from site/.

# Paths searched for a test naming a no-browser criterion's anchor.
tests = ["tests"]

[repos.hsk-network]
url = "https://github.com/varelaseb/hsk-network.git"

# Static preview of site/, as AGENTS.md Preview.
[services.site]
command = 'cd "$QA_REPO_HSK_NETWORK" && exec python3 -m http.server --bind 127.0.0.1 --directory site "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/"

# The committed built word data the site loads (role: learner). Read-only, so reset only
# confirms it is present.
[fixture.graph-data]
repo = "hsk-network"
path = "site/data/graph.json"
reset = 'test -s "$QA_FIXTURE"'

# Every user-facing story names its own start (tests/test_qa_target.py checks it), so none falls back
# to [entry]. Capture narrows a criterion whose Given names a phone to phone width, but never widens
# one or changes touch (jev-capture.spec.html#jc-ac-viewport), so a story's viewport and touch follow
# its browser criteria's Givens: desktop when any names a desktop, phone with touch when one names a
# phone and none a desktop; a network story naming neither is desktop.
[entry]
url = "{site}/"

[entry.stories]
# Network (hsk-network.spec.html): the site root.
story-explore           = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-inspect           = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-breakdown         = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }
story-strokes           = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }
story-search            = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-levels            = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-collections       = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-phone             = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }
story-link              = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-open-game         = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-sources           = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-hear-card         = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }
story-voice-setting     = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-read              = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-script            = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }
story-look              = { url = "{site}/", viewport = { width = 1280, height = 800 } }
story-dark              = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }
story-breakdown-sources = { url = "{site}/", viewport = { width = 1280, height = 800 } }
# Bubbles (hsk-bubbles.spec.html): every story starts at the game page on a phone with touch. Two hold
# desktop criteria too (story-play's mouse hints, story-inspect-char's right-click); capture cannot
# widen them, so they run at phone width with touch.
story-play              = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-word              = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-inspect-char      = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-fall              = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-progress          = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-deck              = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-game-levels       = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-review            = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-hear              = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-quiet             = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-game-script       = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
story-game-dark         = { url = "{site}/bubbles/", viewport = { width = 390, height = 844 }, touch = true }
# App shell (hsk-app.spec.html): the network on a phone with touch; game criteria reach the game
# through their nav hints below. Criteria needing the iPhone Share sheet, the installed home screen
# app, airplane mode, a notch, or a phone turn stay as written; capture reports what it cannot drive.
story-install           = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }
story-native            = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }
story-offline           = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }
story-fast              = { url = "{site}/", viewport = { width = 390, height = 844 }, touch = true }

# Search fill values, all from site/data/graph.json.
[entry.criteria.acceptance-search-hanzi]
values = ["學生"]
[entry.criteria.acceptance-search-zhuyin]
values = ["ㄒㄩㄝㄕㄥ"]
[entry.criteria.acceptance-search-english]
values = ["student"]
[entry.criteria.acceptance-search-none]
values = ["qzqzqz"]
[entry.criteria.acceptance-glide]
values = ["學生"]
# Pinyin of 學生 (xue2 sheng5) without tone marks.
[entry.criteria.acceptance-script-search]
values = ["xuesheng"]
[entry.criteria.acceptance-reduced-network]
values = ["學生"]
# Hub 學 and four words that share it.
[entry.criteria.acceptance-cluster]
values = ["學", "學生", "學校", "學習", "同學"]
# Home screen icon character 學, Zhuyin ㄒㄩㄝˊ in its column.
[entry.criteria.acceptance-add]
values = ["學", "ㄒㄩㄝˊ"]

[entry.criteria.acceptance-hosted]
cannot_host = "needs the public GitHub Pages address after a merge to main; this environment serves a local preview of the candidate head"
[entry.criteria.acceptance-game-hosted]
cannot_host = "needs the public GitHub Pages game address after a merge to main; this environment serves a local preview of the candidate head"

# Navigation hints (jev-capture.spec.html#jc-target-nav). Game page address options
# (site/bubbles/game.js): ?fixture=pop|fall|clear|over starts Play on a fixed board, ?seed=N fixes the
# seed. Each criterion's When taps Play itself, so no hint selects it.

# Network: word links.
[nav.acceptance-word-link]
path = "/#word=1-128" # word id of 學生 in site/data/graph.json
[nav.acceptance-word-link-unknown]
path = "/#word=qzqzqz"

# Network: reading cards (word ids in site/data/graph.json).
[nav.acceptance-senses]
path = "/#word=1-98" # 書: four senses, measure words 本 and 冊
[nav.acceptance-sense-ref]
path = "/#word=1-57" # 裡: sense "also written 裏"
[nav.acceptance-sense-tag]
path = "/#word=1-9" # 菜: sense tagged "colloquial"
[nav.acceptance-zhuyin-column]
path = "/#word=1-76" # 朋友 (peng2 you5): neutral second syllable

# Bubbles: playing a seeded board.
[nav.acceptance-aim]
path = "?seed=7"
[nav.acceptance-shoot]
path = "?seed=7"
[nav.acceptance-cancel]
path = "?seed=7"
[nav.acceptance-swap]
path = "?seed=7"
[nav.acceptance-ceiling]
path = "?seed=7"
[nav.acceptance-pause]
path = "?seed=7"
[nav.acceptance-sound-on]
path = "?seed=7"
# First shot hint: the shot lands on the seeded board, as acceptance-shoot; a reload keeps the seed.
[nav.acceptance-first-hint-shot]
path = "?seed=7"
[nav.acceptance-first-hint-later]
path = "?seed=7"
[nav.acceptance-first-hint-mouse-shot]
path = "?seed=7"
[nav.acceptance-first-hint-mouse-later]
path = "?seed=7"
# Character card closes: the right-click or long press and the dismissal on the seeded board.
[nav.acceptance-inspect-desktop-close]
path = "?seed=7"
[nav.acceptance-inspect-desktop-current-close]
path = "?seed=7"
[nav.acceptance-inspect-desktop-next-close]
path = "?seed=7"
[nav.acceptance-inspect-touch-close]
path = "?seed=7"
[nav.acceptance-inspect-touch-current-close]
path = "?seed=7"
[nav.acceptance-inspect-touch-next-close]
path = "?seed=7"
# Dark game screens (story-game-dark): each reaches its screen as acceptance-pause, -pop, and -over do.
# The device's dark appearance itself has no qa.toml option; capture reports it.
[nav.acceptance-game-dark-pause]
path = "?seed=7"

# Bubbles: fixed boards. pop: 生 in the launcher completes 學生 with 學 on the board; a shot
# elsewhere (next to 站, or the empty right cell) spells no word.
[nav.acceptance-pop]
path = "?fixture=pop"
[nav.acceptance-no-word]
path = "?fixture=pop"
[nav.acceptance-reduced]
path = "?fixture=pop"
[nav.acceptance-game-look]
path = "?fixture=pop"
[nav.acceptance-game-dark-card]
path = "?fixture=pop"
# First visit: the learner taps Play, then shoots 生 beside 學.
[nav.acceptance-muted]
path = "?fixture=pop"
# fall: 生 beside 學 pops 學生, leaving the bubbles below it hanging.
[nav.acceptance-fall]
path = "?fixture=fall"
# clear: the only word left is 學 plus the launcher's 生.
[nav.acceptance-round]
path = "?fixture=clear"
[nav.acceptance-round-next]
path = "?fixture=clear"
# over: the lowest bubbles sit one row above the line, with 學 in the bottom row for 生 to pop;
# a later shot settling below the line ends the game.
[nav.acceptance-over]
path = "?fixture=over"
[nav.acceptance-best]
path = "?fixture=over"
[nav.acceptance-review]
path = "?fixture=over"
[nav.acceptance-review-link]
path = "?fixture=over"
[nav.acceptance-game-dark-over]
path = "?fixture=over"

# App shell: game starts.
[nav.acceptance-add-from-game]
path = "/bubbles/"
[nav.acceptance-add-from-game-open]
path = "/bubbles/"
# Review screen: the over board ends the game, as acceptance-review-link.
[nav.acceptance-word-in-app]
path = "/bubbles/?fixture=over"

# Network: hub drawings (word ids in site/data/graph.json, hub data in site/data/drawing.json).
# Each opens a word whose hub the learner then taps. acceptance-strokes-dark needs the device's dark
# appearance (prefers-color-scheme); qa.toml has no color-scheme option, so it has no hint here.
[nav.acceptance-strokes-draw]
path = "/#word=1-102" # 說話: hub 話, parts 訁 and 舌
[nav.acceptance-strokes-radical-mark]
path = "/#word=1-102" # 說話: hub 話, radical 言 is part 訁
[nav.acceptance-strokes-part]
path = "/#word=1-102"
[nav.acceptance-strokes-radical]
path = "/#word=1-102"
[nav.acceptance-strokes-move]
path = "/#word=1-102"
[nav.acceptance-strokes-clear]
path = "/#word=1-102"
[nav.acceptance-strokes-repeat]
path = "/#word=1-24" # 多: part 夕 twice
[nav.acceptance-strokes-single]
path = "/#word=1-85" # 人: not split, its own radical
[nav.acceptance-strokes-phone]
path = "/#word=2-28" # 高: parts 亠, 口, 冋

# Network: hearing a card (word ids in site/data/graph.json; Zhuyin is the default script, Voice is on
# by default). The syllable, symbol, measure word, and pinyin sounds are no-screen criteria proven by
# tests/speak.test.mjs, so they have no hint.
[nav.acceptance-speak-word]
path = "/#word=1-17" # 電腦 (dian4 nao3), recorded
[nav.acceptance-speak-reading]
path = "/#word=2-8" # 長 (chang2): hub 長, readings zhang3 then chang2

# Network: Voice setting. acceptance-voice-network and acceptance-voice-off start at the story's site
# root with Voice on (first visit), and acceptance-voice-shared turns Voice off there then opens the
# game through the Play link, so none has a hint.
